[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sqlverdict"
dynamic = ["version"]
description = "Rule-based scorer for Text-to-SQL results that catches silent_wrong SQL"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "songwookun" }]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]
keywords = ["text-to-sql", "evaluation", "execution-accuracy", "llm", "sql"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Repository = "https://github.com/songwookun/sqlverdict"

[tool.hatch.version]
path = "src/sqlverdict/_version.py"

[project.scripts]
sqlverdict = "sqlverdict.cli:main"

[dependency-groups]
dev = ["pytest"]
db = ["pymysql", "psycopg[binary]", "oracledb"]
